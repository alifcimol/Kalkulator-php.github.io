<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator Sederhana</title>
<style>
  :root {
    --bg: #f3f5f9; --card: #ffffff; --text: #1b2330; --muted: #5d6879;
    --line: #cfd6e2; --accent: #1f5eff; --accent-text: #ffffff;
    --err-bg: #fdecea; --err-text: #9b1c1c; --ok-bg: #e7f6ec; --ok-text: #14532d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --card: #1b212b; --text: #e8ecf3; --muted: #9aa5b6;
      --line: #354052; --accent: #6d97ff; --accent-text: #0d1320;
      --err-bg: #3a1c1c; --err-text: #ffb4b4; --ok-bg: #16301f; --ok-text: #a7e8bd;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
  label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
  input, select, button { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .field { margin-bottom: 14px; }
  button { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; cursor: pointer; }
  #output { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 1rem; display: none; }
  #output.error { display: block; background: var(--err-bg); color: var(--err-text); }
  #output.ok { display: block; background: var(--ok-bg); color: var(--ok-text); }
</style>
</head>
<body>
<main>
  <h1>Kalkulator Sederhana</h1>
  <p class="sub">Tambah, kurang, kali, dan bagi.</p>

  <div class="field">
    <label for="angka1">Angka pertama</label>
    <input id="angka1" type="text" inputmode="decimal" autocomplete="off">
  </div>
  <div class="field">
    <label for="operator">Operator</label>
    <select id="operator">
      <option value="+">+ (tambah)</option>
      <option value="-">- (kurang)</option>
      <option value="*">* (kali)</option>
      <option value="/">/ (bagi)</option>
    </select>
  </div>
  <div class="field">
    <label for="angka2">Angka kedua</label>
    <input id="angka2" type="text" inputmode="decimal" autocomplete="off">
  </div>

  <button id="hitung" type="button">Hitung</button>
  <div id="output" role="status" aria-live="polite"></div>
</main>

<script>
  const out = document.getElementById('output');

  function tampil(pesan, jenis) {
    out.textContent = pesan;
    out.className = jenis;
  }

  function hitung() {
    const s1 = document.getElementById('angka1').value.trim().replace(',', '.');
    const s2 = document.getElementById('angka2').value.trim().replace(',', '.');
    const op = document.getElementById('operator').value;

    // Validasi input
    if (s1 === '' || s2 === '' || isNaN(Number(s1)) || isNaN(Number(s2))) {
      return tampil('Kedua input harus berupa angka.', 'error');
    }
    const a = Number(s1), b = Number(s2);

    if (op === '/' && b === 0) {
      return tampil('Pembagian dengan nol tidak diperbolehkan.', 'error');
    }

    let hasil;
    switch (op) {
      case '+': hasil = a + b; break;
      case '-': hasil = a - b; break;
      case '*': hasil = a * b; break;
      case '/': hasil = a / b; break;
    }
    hasil = Math.round(hasil * 1e10) / 1e10;
    tampil(a + ' ' + op + ' ' + b + ' = ' + hasil, 'ok');
  }

  document.getElementById('hitung').addEventListener('click', hitung);
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter') hitung(); });
</script>
</body>
</html>
