<?php
declare(strict_types=1);

// Latihan 1: Kalkulator sederhana (+, -, *, /) dengan penanganan pembagian nol

$hasil    = null;
$error    = '';
$angka1   = '';
$angka2   = '';
$operator = '+';

if ($_SERVER['REQUEST_METHOD'] === 'POST') {
    $angka1   = trim($_POST['angka1'] ?? '');
    $angka2   = trim($_POST['angka2'] ?? '');
    $operator = $_POST['operator'] ?? '';

    // Validasi di sisi server (jangan percaya input pengguna)
    if (!is_numeric($angka1) || !is_numeric($angka2)) {
        $error = 'Kedua input harus berupa angka.';
    } elseif (!in_array($operator, ['+', '-', '*', '/'], true)) {
        $error = 'Operator tidak valid.';
    } else {
        $a = (float) $angka1;
        $b = (float) $angka2;

        if ($operator === '/' && $b === 0.0) {
            $error = 'Pembagian dengan nol tidak diperbolehkan.';
        } else {
            $hasil = match ($operator) {
                '+' => $a + $b,
                '-' => $a - $b,
                '*' => $a * $b,
                '/' => $a / $b,
            };
        }
    }
}
?>
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator PHP</title>
    <style>
        body { font-family: sans-serif; max-width: 420px; margin: 40px auto; }
        input, select, button { padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
        .error { color: #b00020; }
        .hasil { font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Kalkulator</h1>

    <form method="post">
        <label>Angka pertama</label>
        <input type="text" name="angka1" value="<?= htmlspecialchars($angka1, ENT_QUOTES, 'UTF-8') ?>" required>

        <label>Operator</label>
        <select name="operator">
            <option value="+" <?= $operator === '+' ? 'selected' : '' ?>>+ (tambah)</option>
            <option value="-" <?= $operator === '-' ? 'selected' : '' ?>>- (kurang)</option>
            <option value="*" <?= $operator === '*' ? 'selected' : '' ?>>× (kali)</option>
            <option value="/" <?= $operator === '/' ? 'selected' : '' ?>>÷ (bagi)</option>
        </select>

        <label>Angka kedua</label>
        <input type="text" name="angka2" value="<?= htmlspecialchars($angka2, ENT_QUOTES, 'UTF-8') ?>" required>

        <button type="submit">Hitung</button>
    </form>

    <?php if ($error !== ''): ?>
        <p class="error"><?= htmlspecialchars($error, ENT_QUOTES, 'UTF-8') ?></p>
    <?php elseif ($hasil !== null): ?>
        <p class="hasil">
            <?= htmlspecialchars("$angka1 $operator $angka2 = $hasil", ENT_QUOTES, 'UTF-8') ?>
        </p>
    <?php endif; ?>
</body>
</html>
